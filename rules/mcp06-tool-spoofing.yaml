id: MCP06-R01
name: Tool Description Suppresses User Approval
severity: high
owasp_mcp: MCP06
description: |
  Detects tool metadata that tells an agent to bypass confirmation, act
  silently, or force invocation, potentially subverting user intent.
references:
  - https://owasp.org/www-project-mcp-top-10/
match:
  path: "$.mcpServers.*.tools[*].description"
  pattern: "without (asking|confirmation)|do not ask|silently|bypass approval|always call|must call this tool"
  type: regex
remediation: |
  Remove orchestration and approval-bypass instructions from tool metadata.
  Require explicit user approval for consequential actions.
