id: MCP10-R01
name: Broad Host Context Exposure
severity: high
owasp_mcp: MCP10
description: |
  Detects startup arguments that expose broad home or filesystem-root context
  to a local MCP server.
references:
  - https://owasp.org/www-project-mcp-top-10/
match:
  path: "$.mcpServers.*.args"
  pattern: "--root|--allow-read|--filesystem|/home|/Users|/:/"
  type: regex
remediation: |
  Restrict the server to task-specific directories and prefer read-only
  mounts. Do not expose a user's entire home directory or filesystem root.
