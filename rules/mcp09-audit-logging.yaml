id: MCP08-R01
name: Audit Logging Explicitly Disabled
severity: high
owasp_mcp: MCP08
scope: remote
description: |
  Detects enriched manifests that explicitly disable logging or audit events.
  Absence of a nonstandard logging field is not treated as proof of missing
  server-side telemetry.
references:
  - https://owasp.org/www-project-mcp-top-10/
match:
  path: "$.mcpServers.*.logging"
  pattern: "\"(enabled|audit)\"\\s*:\\s*false"
  type: regex
remediation: |
  Add a logging configuration block to every MCP server with audit logging
  enabled. Example:
    "logging": {
      "enabled": true,
      "level": "info",
      "audit": true
    }
  Ensure logs capture tool invocations, authentication events, permission
  checks, and errors. Send logs to a centralized, tamper-evident log store.
