id: MCP07-R02
name: Explicit Authentication Block Missing Type
severity: high
owasp_mcp: MCP07
scope: remote
description: |
  Detects an explicitly configured authentication block that does not name
  its mechanism. Absence of a nonstandard auth field is not treated as proof
  that a remote implementation is unauthenticated.
references:
  - https://owasp.org/www-project-mcp-top-10/
match:
  path: "$.mcpServers.*.auth"
  pattern: "\"type\"\\s*:"
  type: not_regex
remediation: |
  Specify and enforce the authentication mechanism. Prefer OAuth 2.1 for
  remote MCP and audience-bound access tokens. Example:
    "auth": {
      "type": "oauth2"
    }
