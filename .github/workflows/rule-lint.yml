name: Rule Lint

on:
  pull_request:
    paths:
      - "rules/**/*.yml"
      - "rules/**/*.yaml"

permissions:
  contents: read

jobs:
  validate-rules:
    name: Validate Rule YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint rule YAML files
        run: yamllint -c .yamllint.yml rules/
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate rule schema
        run: |
          for rule in rules/*.yaml rules/*.yml; do
            [ -e "$rule" ] || continue
            go run ./cmd/mcpsec rules validate "$rule"
          done
